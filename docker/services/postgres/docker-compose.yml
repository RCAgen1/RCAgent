services:
  db:
    image: postgres:17-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-db-net

  # One-shot service: applies database migrations, then exits.
  # migrate:
  #   build: .
  #   networks:
  #     - backend-db-net
  #   env_file:
  #     - .env
  #   entrypoint: ["sh", "-c", "goose -dir /app/migrations postgres \"$$DATABASE_URL\" up"]
  #   restart: "no"

volumes:
  postgres_data:

# docker network create backend-db-net

networks:
  backend-db-net:
    external: true