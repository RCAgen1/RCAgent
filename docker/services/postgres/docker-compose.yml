db:
    image: postgres:17-alpine
    restart: always
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

# One-shot service: applies database migrations, then exits.
migrate:
  build: .
  networks:
    - backend
  env_file:
    - .env
  entrypoint: ["sh", "-c", "goose -dir /app/migrations postgres \"$$DATABASE_URL\" up"]
  depends_on:
    db:
      condition: service_healthy
  restart: "no"

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge